[project]
name = "invoiceiq-backend"
version = "0.1.0"
description = "InvoiceIQ — agentic AI invoice processing backend (FastAPI + LangGraph)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "fastapi[standard]==0.163.2",
    "fastembed==0.9.1",
    "langchain-core>=1.8.2",
    "langchain-google-genai>=4.5.0",
    "langchain-groq>=1.2.0",
    "langchain-postgres==0.0.19",
    "langchain-text-splitters==1.1.3",
    "pgvector==0.3.6",
    "pillow==13.0.0",
    "psycopg[binary]==3.3.9",
    "pydantic-settings==2.16.3",
    "pymupdf==2.1",
    "rapidfuzz==3.14.3",
    "sqlalchemy[asyncio]==2.1.9",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "aiosqlite==0.22.1",
    "httpx==0.28.1",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "reportlab==5.1.0",
    "ruff==0.17.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow the ₹ sign and typographic characters in strings

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]
# PyMuPDF's API is only partly annotated.
untyped_calls_exclude = ["pymupdf"]

[[tool.mypy.overrides]]
module = ["reportlab.*"]  # no type hints or stubs published
ignore_missing_imports = true
